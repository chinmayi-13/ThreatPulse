<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · ThreatPulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body.login-body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
  }
  .login-card {
    width: 380px;
    max-width: calc(100vw - 40px);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 34px 30px 28px;
  }
  .login-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
  .login-title { font-size: 15px; margin-bottom: 4px; }
  .login-sub { font-size: 12.5px; color: var(--text-dim); margin-bottom: 22px; }
  .login-foot { margin-top: 18px; font-size: 12px; color: var(--text-faint); text-align: center; }
  .error-msg {
    display: none;
    font-size: 12.5px;
    color: var(--critical);
    background: var(--critical-bg);
    border: 1px solid rgba(229,72,77,0.3);
    padding: 9px 12px;
    border-radius: var(--radius-sm);
    margin-bottom: 16px;
  }
</style>
</head>
<body class="login-body">
  <form class="login-card" id="loginForm" novalidate>
    <div class="login-brand">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-name">ThreatPulse</div>
        <div class="brand-sub">Threat Detection &amp; Response</div>
      </div>
    </div>

    <div class="login-title">Analyst sign-in</div>
    <div class="login-sub">Use your SOC credentials to access the console.</div>

    <div class="error-msg" id="errorMsg">Incorrect analyst ID or password. Try again.</div>

    <div class="field">
      <label for="analystId">Analyst ID</label>
      <input class="input" id="analystId" name="analystId" placeholder="j.alvarez" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input class="input" id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
    </div>

    <button class="btn btn-primary" type="submit" style="width:100%; margin-top:6px;" id="submitBtn">Sign in</button>

    <div class="login-foot">Access is logged and monitored</div>
  </form>

<script src="js/common.js"></script>
<script>
  // TODO(API): POST /api/auth/login  { analystId, password } -> { token, name, role }
  // Swap the setTimeout mock below for the real fetch call. On success,
  // store the session token and redirect to dashboard.html.
  const form = document.getElementById('loginForm');
  const errorMsg = document.getElementById('errorMsg');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    errorMsg.style.display = 'none';
    const id = document.getElementById('analystId').value.trim();
    const pw = document.getElementById('password').value;

    if (!id || !pw) {
      errorMsg.textContent = 'Enter both an analyst ID and password.';
      errorMsg.style.display = 'block';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Verifying…';

    setTimeout(() => {
      sessionStorage.setItem('vantage_analyst', id);
      window.location.href = 'dashboard.html';
    }, 500);
  });
</script>
</body>
</html>
